name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Deploy to OVH via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /www/dev/tu-valu/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .env
            .gitignore
            README.md
            PICTURE_IMPORT_IMPLEMENTATION.md
            SUPABASE_SETUP.md
            AUTHENTICATION_IMPLEMENTATION.md
            QUICK_START_AUTH.md
            MAGIC_LINK_TROUBLESHOOTING.md
            OAUTH_SETUP_GUIDE.md
            .instructions.md
            vite.config.js
            package.json
            package-lock.json
            yarn.lock
            .vscode/**
            .github/**

      - name: Create .env file on server
        run: |
          # Create .env content
          ENV_CONTENT="OVH_S3_ENDPOINT=${{ secrets.OVH_S3_ENDPOINT }}
          OVH_S3_BUCKET=${{ secrets.OVH_S3_BUCKET }}
          OVH_S3_REGION=${{ secrets.OVH_S3_REGION }}
          OVH_S3_ACCESS_KEY=${{ secrets.OVH_S3_ACCESS_KEY }}
          OVH_S3_SECRET_KEY=${{ secrets.OVH_S3_SECRET_KEY }}"

          # Upload .env file via curl and FTP
          echo "$ENV_CONTENT" > /tmp/api.env
          curl -T /tmp/api.env ftp://${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}@${{ secrets.FTP_HOST }}/www/dev/tu-valu/api/.env
