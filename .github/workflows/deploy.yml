name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Install PHP dependencies
        run: composer install --no-dev --prefer-dist --working-dir=api --no-interaction

      - name: Deploy to OVH via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /www/dev/tu-valu/

      - name: Create .env file
        run: |
          cat > api/.env << EOF
          OVH_S3_ENDPOINT=https://s3.bhs.io.cloud.ovh.net
          OVH_S3_BUCKET=young-blackett
          OVH_S3_REGION=bhs
          OVH_S3_ACCESS_KEY=${OVH_S3_ACCESS_KEY}
          OVH_S3_SECRET_KEY=${OVH_S3_SECRET_KEY}
          EOF
        env:
          OVH_S3_ACCESS_KEY: ${{ secrets.OVH_S3_ACCESS_KEY }}
          OVH_S3_SECRET_KEY: ${{ secrets.OVH_S3_SECRET_KEY }}

      - name: Deploy API and .env to OVH via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./api/
          server-dir: /www/dev/tu-valu/api/
